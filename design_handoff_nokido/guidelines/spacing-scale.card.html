<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--bg-0); display: flex; gap: 16px; align-items: flex-end; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .bar { background: var(--purple); border-radius: 2px; width: 100%; }
  .b { width: 26px; }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); }
</style></head>
<body>
  <div class="item"><div class="bar b" style="height:4px"></div><span class="lbl">2</span></div>
  <div class="item"><div class="bar b" style="height:8px"></div><span class="lbl">4</span></div>
  <div class="item"><div class="bar b" style="height:12px"></div><span class="lbl">6</span></div>
  <div class="item"><div class="bar b" style="height:16px"></div><span class="lbl">8</span></div>
  <div class="item"><div class="bar b" style="height:22px"></div><span class="lbl">12</span></div>
  <div class="item"><div class="bar b" style="height:28px"></div><span class="lbl">16</span></div>
  <div class="item"><div class="bar b" style="height:40px"></div><span class="lbl">20</span></div>
  <div class="item"><div class="bar b" style="height:56px"></div><span class="lbl">28</span></div>
  <div class="item"><div class="bar b" style="height:64px"></div><span class="lbl">32</span></div>
</body></html>
