<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 18px; background: var(--bg-0); }
  .row { display: flex; gap: 10px; }
  .sw { flex: 1; border-radius: var(--radius-sm); padding: 10px; height: 84px; display: flex; flex-direction: column; justify-content: flex-end; }
  .name { font-family: var(--font-mono); font-size: 10.5px; color: rgba(0,0,0,0.65); font-weight: 700; }
  .hex { font-family: var(--font-mono); font-size: 9.5px; color: rgba(0,0,0,0.5); margin-top: 2px; }
</style></head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--purple)"><span class="name">purple</span><span class="hex">#774AFF</span></div>
    <div class="sw" style="background:var(--blue)"><span class="name">blue</span><span class="hex">#3BB2D0</span></div>
    <div class="sw" style="background:var(--cyan)"><span class="name">cyan</span><span class="hex">#2DD4BF</span></div>
    <div class="sw" style="background:var(--green)"><span class="name">green</span><span class="hex">#4AC28B</span></div>
    <div class="sw" style="background:var(--yellow)"><span class="name">yellow</span><span class="hex">#FFC22D</span></div>
    <div class="sw" style="background:var(--orange)"><span class="name">orange</span><span class="hex">#FF9142</span></div>
    <div class="sw" style="background:var(--red)"><span class="name">red</span><span class="hex">#F24F4F</span></div>
    <div class="sw" style="background:var(--pink)"><span class="name">pink</span><span class="hex">#EC4899</span></div>
  </div>
</body></html>
