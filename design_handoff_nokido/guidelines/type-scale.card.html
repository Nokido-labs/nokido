<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--bg-0); color: var(--text-primary); font-family: var(--font-sans); }
  .row { display: flex; align-items: baseline; gap: 14px; padding: 5px 0; border-bottom: 1px solid var(--border-subtle); }
  .row:last-child { border: 0; }
  .tag { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); width: 120px; flex-shrink: 0; }
  .ex { color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style></head>
<body>
  <div class="row"><span class="tag">3xl · 700</span><span class="ex" style="font-size:var(--text-3xl);font-weight:700;letter-spacing:-0.01em">Souveraineté</span></div>
  <div class="row"><span class="tag">2xl · 700</span><span class="ex" style="font-size:var(--text-2xl);font-weight:700">Connecter 8 milliards de cerveaux</span></div>
  <div class="row"><span class="tag">xl · 700</span><span class="ex" style="font-size:var(--text-xl);font-weight:700;letter-spacing:0.4px">Titre de page</span></div>
  <div class="row"><span class="tag">lg · 600</span><span class="ex" style="font-size:var(--text-lg);font-weight:600">Titre de section</span></div>
  <div class="row"><span class="tag">md · 700</span><span class="ex" style="font-size:var(--text-md);font-weight:700">Titre de carte</span></div>
  <div class="row"><span class="tag">base · 400</span><span class="ex" style="font-size:var(--text-base)">Corps par défaut — local par défaut, cloud en dernier recours.</span></div>
  <div class="row"><span class="tag">sm · 400</span><span class="ex" style="font-size:var(--text-sm);color:var(--text-secondary)">Corps secondaire, tableaux denses.</span></div>
</body></html>
