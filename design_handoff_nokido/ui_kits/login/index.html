<!doctype html>
<html lang="fr" data-theme="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nokido — Verrouillage</title>
<link rel="stylesheet" href="../../styles.css">
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<script src="../../assets/laforge-prefs.js"></script>
<script src="/static/lucide.min.js"></script>
<script src="/static/react.min.js"></script>
<script src="/static/react-dom.min.js"></script>
<script src="/static/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  html, body { height: 100%; }
  body { margin: 0; background: radial-gradient(ellipse at 50% -10%, #1c1730 0%, var(--bg-0) 55%); }
</style>
</head><body>
<div id="root"></div>
<script type="text/babel" src="login-screen.ref.jsx"></script>
<script type="text/babel">
function App() {
  const { LoginScreen } = window;
  const [unlocked, setUnlocked] = React.useState(false);
  React.useEffect(() => { if (window.lucide) lucide.createIcons(); });
  if (unlocked) {
    return (
      <div style={{ minHeight: "100vh", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: "14px", color: "var(--text-primary)" }}>
        <div style={{ color: "var(--prov-local)" }}><i data-lucide="lock-open" style={{ width: 34, height: 34 }} /></div>
        <div style={{ fontSize: "18px", fontWeight: 700 }}>Coffre déverrouillé</div>
        <a href="../hub/index.html" style={{ fontFamily: "var(--font-mono)", fontSize: "13px", color: "var(--purple)" }}>Entrer dans le hub →</a>
        <button onClick={() => setUnlocked(false)} style={{ marginTop: "8px", background: "transparent", border: "1px solid var(--border)", color: "var(--text-dim)", borderRadius: "var(--radius-sm)", padding: "6px 12px", cursor: "pointer", fontSize: "12px" }}>Reverrouiller</button>
      </div>
    );
  }
  return <LoginScreen onUnlock={() => setUnlocked(true)} />;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
setTimeout(() => window.lucide && lucide.createIcons(), 100);
</script>
</body></html>
