# =============================================================================
# Configuration outils d'analyse statique
# =============================================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit:        Tests unitaires rapides (< 100ms, pas de I/O)",
    "integration: Tests d'integration (DB, fichiers, modules complets)",
    "nr:          Non-regression — comportement fige, golden datasets",
    "slow:        Tests lents (> 1s) — exclus du run rapide",
    "security:    Tests de securite (Integrity, Sentinel, tokens)",
    # Declares le 2026-08-14 en cablant tests/nr dans la CI : `--strict-markers`
    # refusait la collecte de deux fichiers NR, qui ne tournaient donc NULLE
    # PART. `filterwarnings` est pourtant natif — mais `-p no:warnings` ci-dessous
    # desenregistre le plugin qui le fournit ; `asyncio` vient de pytest-asyncio.
    # Les declarer fait tourner ces tests plutot que d'allonger la liste des
    # --ignore, qui est deja la ou deux autres NR ont ete mis de cote.
    "asyncio:     Tests asynchrones (pytest-asyncio)",
    "filterwarnings: Filtrage de warnings (natif, masque par -p no:warnings)",
]
addopts = "-v --tb=short --strict-markers -p no:warnings --ignore=tests/nr/test_import_all_nr.py --ignore=tests/nr/test_behavior_nr.py"
norecursedirs = [
    ".git", ".cache", "versions", "workspace",
    "sandbox", "logs", "app/backups", "app/legacy", "models"
]

# Ruff config canonique : voir ruff.toml a la racine (priorite explicite).
# Bloc supprime de pyproject.toml pour eviter double source de verite.

[tool.mypy]
python_version         = "3.14"
ignore_missing_imports = true
follow_imports         = "silent"
disallow_untyped_defs  = false
check_untyped_defs     = false
warn_return_any        = false
warn_unused_ignores    = false
no_error_summary       = true

[tool.pylint.main]
jobs       = 1
persistent = false

[tool.pylint."messages control"]
disable = ["C", "R"]

[tool.pylint.format]
max-line-length = 120
