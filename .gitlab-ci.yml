# Nokido -- CI du MIROIR GitLab (owner 2026-10-13 : « tous les outils dispo CI/CD », raccord avec le GitHub public).
#
# VERIFICATION SEULEMENT. La CI de reference, la release et toute publication restent sur GitHub
# (github.com/Nokido-labs/nokido) : ce miroir ne publie rien, ne deploie rien et ne porte AUCUN secret ni variable
# protegee -- ses journaux sont publics par construction. Il rejoue, sur un runner Linux de GitLab, le parcours
# qu'un inconnu suit avec le README : wheel du depot -> pip install [organisme] -> nokido-composants -> doctor ->
# nokido-hub -> /mcp -> premier usage -> arret -> desinstallation (tools/forge_install_acceptance.py --paquet).
# Une seconde preuve d'installation, sur une autre infrastructure que celle de la reference.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v/
    - if: $CI_PIPELINE_SOURCE == "web"

default:
  interruptible: true

stages:
  - verifier

parcours-paquet:
  stage: verifier
  image: python:3.12-slim
  timeout: 90 minutes
  variables:
    NOKIDO_RUNTIME: "$CI_PROJECT_DIR/_runtime"
    PYTHONUTF8: "1"
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
  script:
    - python -m pip install --quiet build
    - python -m build --wheel --outdir _wheel
    - ROUE="$(python -c 'import glob, pathlib; print(pathlib.Path(sorted(glob.glob("_wheel/*.whl"))[-1]).resolve().as_posix())')"
    - python tools/forge_install_acceptance.py "--paquet=${ROUE}[organisme]"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - _runtime/rapport_paquet.json
      - _runtime/logs/
