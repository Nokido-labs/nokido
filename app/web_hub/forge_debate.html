<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Débat inter-agents — Nokido</title>
<link rel="icon" type="image/svg+xml" href="/static/nokido-favicon.svg">
<link rel="stylesheet" href="/static/nokido.css">
<style>
:root{--v:#8b5cf6;--v2:#a78bfa;--ok:#34d399;--warn:#fbbf24;--bd:rgba(139,92,246,.28);--glass:rgba(139,92,246,.06);}
body{max-width:920px;margin:0 auto;padding:28px 20px 80px;font-family:Inter,system-ui,sans-serif;color:#e5e7eb;background:#0d0c14;}
h1{font-size:1.5rem;margin:0 0 4px;background:linear-gradient(90deg,var(--v2),var(--v));-webkit-background-clip:text;background-clip:text;color:transparent;}
.sub{color:#9ca3af;font-size:.85rem;margin-bottom:22px;}
.card{background:var(--glass);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:16px;backdrop-filter:blur(8px);}
label{display:block;font-size:.8rem;color:#c4b5fd;margin:12px 0 5px;font-weight:600;}
textarea,input[type=text],select{width:100%;box-sizing:border-box;background:rgba(0,0,0,.35);border:1px solid var(--bd);border-radius:9px;color:#f3f4f6;padding:10px 12px;font:inherit;}
textarea{min-height:76px;resize:vertical;}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:center;}
.row>div{flex:1;min-width:130px;}
.toggle{display:flex;align-items:center;gap:9px;margin-top:16px;cursor:pointer;color:#e5e7eb;font-weight:500;}
.toggle input{width:18px;height:18px;accent-color:var(--v);}
.toggle small{color:#9ca3af;font-weight:400;}
button{margin-top:18px;background:linear-gradient(90deg,var(--v),var(--v2));color:#fff;border:0;border-radius:10px;padding:12px 22px;font-weight:700;font-size:.95rem;cursor:pointer;transition:opacity .15s;}
button:disabled{opacity:.5;cursor:progress;}
#status{margin:14px 0;font-size:.9rem;color:var(--v2);min-height:1.2em;}
.badge{display:inline-block;font-size:.68rem;padding:2px 8px;border-radius:999px;background:rgba(139,92,246,.18);border:1px solid var(--bd);color:var(--v2);margin-left:8px;vertical-align:middle;}
.turn{border-left:3px solid var(--v);padding:10px 14px;margin:10px 0;background:rgba(0,0,0,.22);border-radius:0 10px 10px 0;}
.turn .who{font-weight:700;color:#f3f4f6;}
.turn .txt{white-space:pre-wrap;color:#d1d5db;margin-top:6px;font-size:.9rem;line-height:1.5;}
.econ{border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.06);}
.econ h3{margin:0 0 10px;color:var(--ok);font-size:1rem;}
.metrics{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:10px;}
.metrics b{display:block;font-size:1.4rem;color:var(--ok);}
.metrics span{font-size:.72rem;color:#9ca3af;}
table{width:100%;border-collapse:collapse;font-size:.82rem;}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.06);}
th{color:#9ca3af;font-weight:600;}
.note{border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.07);color:var(--warn);}
.intents li{color:#c4b5fd;font-size:.85rem;margin:3px 0;}
.synthesis{white-space:pre-wrap;color:#e5e7eb;font-size:.92rem;line-height:1.6;}
</style>
</head>
<body>
<h1>Débat inter-agents</h1>
<div class="sub">Orchestration multi-tour souveraine. Mode <b>latent</b> = relais self-model LOCAL (RecursiveMAS, ~&minus;60&nbsp;% tokens d'input, 0 cloud) &middot; sinon texte-cloud.</div>

<form id="debate-form" data-testid="debate-form" class="card">
  <label for="obj">Objectif du débat</label>
  <textarea id="obj" data-testid="debate-objective" placeholder="Ex: Faut-il cristalliser un état transient d'agent en blackboard, ou le jeter ? Donne un seuil."></textarea>
  <label for="cons">Contrainte</label>
  <input type="text" id="cons" data-testid="debate-constraint" value="Répondre concis, mécanique concrète.">
  <div class="row">
    <div>
      <label for="rounds">Rounds</label>
      <select id="rounds" data-testid="debate-rounds"><option>1</option><option>2</option><option>3</option></select>
    </div>
  </div>
  <!-- `for` EXPLICITE : l'imbrication label>input suffit au navigateur, mais le
       recensement statique (forge_ui_nervous_census, sans navigateur) ne calcule
       pas le nom accessible par le label englobant -- il classait donc ce controle
       `invisible_agent`, « a l'ecran mais hors de l'arbre accessible ». On ne met
       PAS d'aria-label : il ecraserait le texte du span et priverait un lecteur
       d'ecran du detail (modele, cout, duree). -->
  <label class="toggle" for="latent" data-testid="debate-latent-toggle-wrap">
    <input type="checkbox" id="latent" data-testid="debate-latent-toggle">
    <span>Mode latent <small>(self-model local Qwen-0.5B, ~&minus;60&nbsp;% tokens &middot; CPU ~30-90&nbsp;s)</small></span>
  </label>
  <button type="submit" data-testid="debate-submit">Lancer le débat</button>
</form>

<div id="status" data-testid="debate-status"></div>
<section id="econ" data-testid="debate-econ" class="card econ" hidden></section>
<section id="note" data-testid="debate-note" class="card note" hidden></section>
<section id="transcript" data-testid="debate-transcript"></section>
<section id="synthWrap" class="card" hidden><h3 style="margin-top:0;color:var(--v2)">Synthèse</h3><div id="synth" data-testid="debate-synthesis" class="synthesis"></div></section>
<section id="intentsWrap" class="card" hidden><h3 style="margin-top:0;color:var(--v2)">Intentions captées <small style="color:#9ca3af;font-weight:400">(rapportées, jamais auto-exécutées)</small></h3><ul id="intents" data-testid="debate-intents" class="intents"></ul></section>

<script>
(function(){
  var form=document.getElementById('debate-form');
  var btn=form.querySelector('[data-testid=debate-submit]');
  var statusEl=document.getElementById('status');
  var setTxt=function(el,s){el.textContent=(s==null?'':String(s));};
  var show=function(id,on){document.getElementById(id).hidden=!on;};
  var clear=function(el){while(el.firstChild){el.removeChild(el.firstChild);}};
  var mk=function(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=String(txt);return e;};

  function render(res){
    var econ=document.getElementById('econ');
    clear(econ);
    if(res.latent_economy){
      var e=res.latent_economy;
      econ.appendChild(mk('h3',null,'Économie latente'));
      var metrics=mk('div','metrics');
      var addM=function(big,tid,small){var d=mk('div');var b=mk('b',null,big);if(tid)b.setAttribute('data-testid',tid);d.appendChild(b);d.appendChild(mk('span',null,small));metrics.appendChild(d);};
      addM('−'+e.economie_pct+' %','debate-econ-ratio','tokens input');
      addM(e.tok_latent_total+' vs '+e.tok_texte_total,null,'latent vs texte');
      addM(String(e.hops),null,'hops latents');
      econ.appendChild(metrics);
      var tbl=mk('table');
      var thead=mk('thead');var htr=mk('tr');['Tour','tok latent','tok texte'].forEach(function(h){htr.appendChild(mk('th',null,h));});thead.appendChild(htr);tbl.appendChild(thead);
      var tb=mk('tbody');
      (e.per_turn||[]).forEach(function(t){var r=mk('tr');r.appendChild(mk('td',null,t.turn));r.appendChild(mk('td',null,t.tok_latent));r.appendChild(mk('td',null,t.tok_texte));tb.appendChild(r);});
      tbl.appendChild(tb);econ.appendChild(tbl);
      show('econ',true);
    } else { show('econ',false); }

    var note=document.getElementById('note');
    if(res.latent_note){ setTxt(note,'⚠ '+res.latent_note); show('note',true); } else { show('note',false); }

    var tr=document.getElementById('transcript');
    clear(tr);
    (res.transcript||[]).forEach(function(t,i){
      var card=mk('div','turn');card.setAttribute('data-testid','debate-turn-'+i);
      var who=mk('div','who',t.name);
      var badge=mk('span','badge',t.provider+(t.ok?'':' FAIL'));
      who.appendChild(badge);card.appendChild(who);
      card.appendChild(mk('div','txt',t.text));
      tr.appendChild(card);
    });

    if(res.synthesis){ setTxt(document.getElementById('synth'),res.synthesis); show('synthWrap',true); } else { show('synthWrap',false); }

    var iw=res.captured_intents||[];
    var ul=document.getElementById('intents');clear(ul);
    if(iw.length){ iw.forEach(function(x){ul.appendChild(mk('li',null,x));}); show('intentsWrap',true); }
    else { show('intentsWrap',false); }
  }

  form.addEventListener('submit', function(ev){
    ev.preventDefault();
    var latent=document.getElementById('latent').checked;
    var payload={
      objective:document.getElementById('obj').value.trim(),
      constraint:document.getElementById('cons').value.trim(),
      rounds:parseInt(document.getElementById('rounds').value,10)||1,
      latent:latent
    };
    if(!payload.objective){ setTxt(statusEl,'Objectif requis.'); return; }
    btn.disabled=true;
    setTxt(statusEl, latent?'Débat latent en cours (self-model local, CPU ~30-90 s)…':'Débat en cours…');
    ['econ','note','synthWrap','intentsWrap'].forEach(function(id){show(id,false);});
    clear(document.getElementById('transcript'));
    var ctl=new AbortController();
    var to=setTimeout(function(){ctl.abort();},160000);
    fetch('/api/debate/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),signal:ctl.signal})
      .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
      .then(function(o){
        if(!o.ok || o.j.ok===false){ setTxt(statusEl,'Erreur : '+((o.j&&o.j.error)||('HTTP '+o.ok))); return; }
        setTxt(statusEl,'Mode : '+o.j.mode+' - '+((o.j.transcript||[]).length)+' tours.');
        render(o.j);
      })
      .catch(function(e){ setTxt(statusEl,'Échec : '+(e&&e.name==='AbortError'?'timeout client (>160 s)':e)); })
      .then(function(){ clearTimeout(to); btn.disabled=false; });
  });
})();
</script>
</body>
</html>
