# OWNERS.toml — Registry des responsabilités modulaires Nokido
#
# Phase 30 (2026-05-25). Anti-collision modules (critique Plan-fusion :
# "2 modules Hippocampe, 2 endocriniens, futures collisions immune system/
# lymphatique garanties si pas de registre"). Source de verite déclarative.
#
# Format : chaque [[module]] décrit UN module forge_*.py.
# Champs : path, owner (sous-systeme conceptuel), purpose (1 ligne descriptif
# tech), consumes (autres modules requis), exposes (API publique).
#
# REGLE : avant de creer un nouveau forge_*.py, lire ce fichier + grep si
# le scope est deja couvert. Si chevauchement >50%, ETENDRE l'existant.

[[module]]
path = "app/forge_hormones.py"
owner = "endocrine_view"
purpose = "View in-RAM + SSE push 8 hormones canoniques (transport temps-reel)"
consumes = ["forge_endocrine (dual-write Phase 25)", "forge_critical_events (persist >= 0.9)"]
exposes = ["release", "active", "system_state", "subscribe_event_queue"]

