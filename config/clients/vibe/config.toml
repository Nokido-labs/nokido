default_agent = "laforge"
models = [
    { thinking = "high", alias = "mistral-medium-3.5" },
    { name = "codestral-latest", provider = "mistral", alias = "codestral", thinking = "off" },
]
active_model = "codestral"

[[mcp_servers]]
url = "http://127.0.0.1:8766/mcp"
name = "nokido"
transport = "streamable-http"
disabled = false

[mcp_servers.auth]
api_key_env = "FORGE_TOKEN_VIBE_CLI"
type = "static"

[mcp_servers.auth.headers]
LaForge-Agent-Name = "VIBE_CLI"

[tools.bash]
permission = "never"

[tools.git_bash]
permission = "never"

[tools.powershell]
permission = "never"

[tools.write_file]
permission = "never"

[tools.edit]
permission = "never"

[tools.grep]
permission = "ask"

[tools.read_file]
permission = "always"
