# Plateforme macos-arm64 : ce que la distribution LIVRE pour macos, et ce qu'elle suppose deja la.
schema = "nokido-distribution/plateforme"
version_schema = 1
id = "macos-arm64"
os = "macos"
arch = "arm64"
# Cles de forge_install_prerequis.PREREQUIS (REQUIS + ESSENTIEL) : installes AUTOUR de Nokido,
# jamais embarques (licences, poids, builds par plateforme). Le validateur refuse une cle inconnue.
prerequis = ["python", "git", "deno", "ollama", "netcfg_agent"]

[[composant]]
id = "code-source"
description = "Arbre source du snapshot (git archive, honore export-ignore)"
source = "construit"
construit = "code"
sha256 = "au_build"
taille = "au_build"
licence = "AGPL-3.0-or-later"
obligatoire = true

[[composant]]
id = "vendor-lock"
description = "Provenance des bundles front vendorises (composant, version, licence, sha256)"
source = "construit"
construit = "vendor_lock"
sha256 = "au_build"
taille = "au_build"
licence = "AGPL-3.0-or-later"
obligatoire = true

