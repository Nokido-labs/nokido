# Pack knowledge : le Knowledge Pack essentiel (fragments prouves publics, vecteurs bge-m3 en float16 -- l'ancien
# en-tete disait int8, le code n'a jamais ecrit que du float16) et un pack par SOURCE documentaire tierce.
schema = "nokido-distribution/pack"
version_schema = 1
id = "knowledge"
statut = "PRET"
plateformes = ["windows-x64", "linux-x64", "macos-arm64", "macos-x64"]

[[composant]]
id = "knowledge-pack"
description = "Knowledge Pack essentiel (forge_knowledge_pack_export) : fragments PROUVES publics, vecteurs bge-m3"
source = "construit"
construit = "rag_pack"
sha256 = "au_build"
taille = "au_build"
# Depuis le 2026-10-07, le pack ne contient que des fragments dont le texte se retrouve mot pour mot
# dans un fichier publie du depot public (au commit promu) : son contenu EST le depot, sous sa licence.
# L'ancien export (toute la base : veilles tierces, memoire de l'owner) etait NOASSERTION -- et refuse.
licence = "AGPL-3.0-or-later"
obligatoire = true

# ── Packs par SOURCE documentaire tierce (decisions owner du 2026-10-20) ────────────────────────────────────────
# Un pack par source = par licence, chacun avec sa NOTICE ; tous obligatoires : tout est telecharge par defaut.
# Licence, conditions et preuve : audit source par source du 20/10 (tableau noir discovered_facts,
# licences_rag_public_20261020, lot 2 : docs/audit/licences_docsets_lot2_20261020.md d'AGY). JAMAIS livres :
# documentations Claude et Claude Code (conditions commerciales d'Anthropic), Pro Git (CC BY-NC-SA), et Redis --
# retire le 20/10 : sa documentation actuelle (redis/docs) est en CC BY-NC-SA 4.0, seules d'anciennes archives
# (redis-doc) etaient en CC BY-SA ; la version de notre docset est inconnue, donc on s'abstient. Liste blanche : une
# source absente d'ici n'est jamais exportee.

# RFC (20/10) : IETF TLP 5.0 section 3.c.iii (audit AGY 536584cee) ; la NOTICE joint la legende de CHAQUE RFC retenue.
[[composant]]
id = "knowledge-rfc"
description = "RFC de l'IETF citees par le code et l'owner : fragments verbatim et vecteurs bge-m3"
source = "construit"
construit = "rag_pack_source"
sha256 = "au_build"
taille = "au_build"
famille = "rfc"
licence = "IETF-TLP-5.0"
conditions = "fragments verbatim attribues ; legende d'origine et auteurs de chaque RFC joints a la NOTICE"
preuve = "https://trustee.ietf.org/license-info/"
obligatoire = true

# Physiologie (20/10) : OpenStax Anatomy and Physiology 2e, domaine `physiologie` ; LICENSE lue a la source au commit
# epingle b0058a743b (« Attribution 4.0 International »).
[[composant]]
id = "knowledge-physiologie-openstax"
description = "OpenStax Anatomy and Physiology 2e : fragments et vecteurs bge-m3"
source = "construit"
construit = "rag_pack_source"
sha256 = "au_build"
taille = "au_build"
famille = "github:openstax/osbooks-anatomy-physiology"
domaine = "physiologie"
licence = "CC-BY-4.0"
conditions = "attribution : OpenStax, Anatomy and Physiology 2e, Rice University, https://openstax.org ; texte modifie (decoupe en fragments, en-tete d'attribution sur chacun)"
preuve = "https://github.com/openstax/osbooks-anatomy-physiology/blob/b0058a743b/LICENSE"
obligatoire = true

