# Pack local-llm : inference et embeddings locaux (llama.cpp + poids GGUF, Ollama), le serveur vectoriel Qdrant qui
# range ces embeddings (RAG dense), et Caddy qui termine le TLS du hub -- les binaires tiers natifs que le superviseur
# lance, epingles a la version du poste de reference.
# A_EPINGLER : ni la provenance exacte (depot amont, revision) ni la somme de ces artefacts
# ne sont etablies dans le depot. Les declarer avec une somme inventee serait pire que de les
# dire manquants : ce pack ne se compose pas tant qu'ils ne sont pas epingles.
schema = "nokido-distribution/pack"
version_schema = 1
id = "local-llm"
statut = "A_EPINGLER"
plateformes = ["windows-x64", "linux-x64", "macos-arm64", "macos-x64"]

# llama.cpp publie une build par commit. Epingle le 2026-10-07 : b11461, builds CPU (les builds GPU dependent de la
