# Pack local-llm : inference et embeddings locaux (llama.cpp + poids GGUF).
# A_EPINGLER : ni la provenance exacte (depot amont, revision) ni la somme de ces artefacts
# ne sont etablies dans le depot. Les declarer avec une somme inventee serait pire que de les
# dire manquants : ce pack ne se compose pas tant qu'ils ne sont pas epingles.
schema = "nokido-distribution/pack"
version_schema = 1
id = "local-llm"
statut = "A_EPINGLER"
plateformes = ["windows-x64", "linux-x64"]

# llama.cpp publie une build par commit. Epingle le 2026-10-07 : b11461, builds CPU (les builds GPU dependent de la
# carte et du pilote de chaque machine : ils restent un choix d'installation, pas un composant fixe). Sommes = digest
# sha256 publie par GitHub pour l'asset. Le nom porte la plateforme : le schema n'a pas de champ plateforme.
[[composant]]
id = "llama-server-windows-x64-cpu"
description = "llama.cpp b11461, build CPU Windows x64 (llama-server, embeddings :8099)"
source = "url"
url = "https://github.com/ggml-org/llama.cpp/releases/download/b11461/llama-b11461-bin-win-cpu-x64.zip"
sha256 = "e283199134e74405a3684cfaa3911708ca7d051a8c2a8dcb10b3dfa1678913c3"
taille = 19437105
licence = "MIT"
obligatoire = false

[[composant]]
id = "llama-server-linux-x64-cpu"
description = "llama.cpp b11461, build CPU Linux x64 (llama-server, embeddings :8099)"
source = "url"
url = "https://github.com/ggml-org/llama.cpp/releases/download/b11461/llama-b11461-bin-ubuntu-x64.tar.gz"
sha256 = "9462d9b8243df6de8b6bf1baded7008a97e57d9f88611705a535b64d0682d87a"
taille = 17732768
licence = "MIT"
obligatoire = false

# Epingles le 2026-10-07 : sha256 du fichier LOCAL (data/llm_models/) egal a l'oid LFS servi par le depot
# Hugging Face, a une revision FIXE (pas `main`, qui peut bouger). Licence lue dans la fiche du depot.
# bge-m3 est OBLIGATOIRE : les vecteurs du Knowledge Pack sont des vecteurs bge-m3 1024 d.
[[composant]]
