[[service]]
# Relais SORTANT vers le plan de controle OpenAI. Il long-polle en HTTPS et relaie
# les appels MCP de ChatGPT web vers le bridge local ci-dessus (:8791) : AUCUN port
# entrant n'est ouvert, c'est la propriete qui rend ce montage acceptable.
#
# SORTI DE C:\tmp LE 2026-09-14, sur demande owner. Il y vivait depuis sa mise en
# place la nuit du 14/09, avec la TOTALITE de son etat (binaires, profil, home). Un
# executable hors depot echappe a tous les gardes a la fois -- ni git, ni CI, ni
# git-gate, ni gate d'egress, et `trusted_script` ne s'y applique pas non plus
# puisqu'il exige un fichier suivi par git. Et surtout : rien ne le relancait, donc
# il a disparu au premier redemarrage de la stack, emportant l'acces de ChatGPT.
#
# La cle du plan de controle n'est JAMAIS ecrite ici, et n'a pas non plus a vivre
# dans l'environnement de la machine. Ce bloc `env` est STATIQUE et VERSIONNE : y
# poser un secret le publierait. Le service passe donc par un lanceur qui lit le
# COFFRE (DPAPI) et pose la valeur dans l'environnement du seul sous-processus --
# patron deja prouve pour le jeton GitHub. Une cmdline se lit, un env non.
# Sans cle, le lanceur REFUSE de demarrer en le disant : un relais sans identite
# echouerait cote plan de controle plus tard, sans rapport visible avec la cause.
name = "NokidoOpenAITunnel"
intention = "egress:tunnel_chatgpt"
objectif = "health 8792 repond | canal MCP relaye vers 8791"
wave = 6
cmd = "${PYTHON}"
args = ["tools/forge_tunnel_client_launch.py", "--port", "8792"]
# Pour un relais, le port de sante EST le capteur : `/healthz` et `/readyz` sont
# servis par le daemon lui-meme, un heartbeat y serait redondant.
port = 8792
cwd = "${ROOT}"
deps = [8791]
essential = false
# HOME/USERPROFILE pointent l'etat du relais (sorti de C:\tmp le 2026-09-14) ;
# le lanceur les transmet tels quels au binaire tiers.
env = { PYTHONNOUSERSITE = "1", PYTHONIOENCODING = "utf-8", HOME = "${NOKIDO_BIN}/tunnel-client/home", USERPROFILE = "${NOKIDO_BIN}/tunnel-client/home" }

