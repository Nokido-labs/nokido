# services.toml — declarative service registry for the Nokido supervisor.
#
# Step 1 of the portable-supervisor migration (docs/portable_supervisor_plan.md).
# This file is the cross-OS-portable replacement for the hardcoded SERVICES[]
# array in supervisor.ts. The supervisor loads it; on parse error it falls
# back to the in-code array, so editing this file cannot brick the boot.
#
# ${VAR} placeholders are resolved from [vars] below (or, for secrets like
# ${FORGE_MCP_TOKEN}, from the process environment).
# Per-OS overrides go in [[service.windows]] / [[service.linux]] /
# [[service.macos]] sections (not yet used — Windows is the current target).
#
# runAs (optional) — de-privilege a service that handles untrusted input.
#   runAs = "sandbox-offline"   loopback-only sandbox user (outbound blocked)
#   runAs = "sandbox-online"    sandbox user with internet allowed
# A WASM module is already a capability sandbox; runAs de-privileges the
# *runtime process* (Wasmedge/Spin) — defense-in-depth. Candidates: WASM
# runtime, crawler, CTF tooling. Core trusted services stay SYSTEM (no runAs).
# ENFORCED (2026-06-08) : supervisor.ts route runAs via tools/forge_runas_launcher.py
# -> spawn_as_{sandbox,interactive}_jobbed (LogonUser/WTSQueryUserToken +
# CreateProcessAsUser + Job Object KILL_ON_JOB_CLOSE ; fail-loud si token KO,
# jamais de fallback SYSTEM silencieux). Consommateurs : NokidoCTFBrowserMCP
# (interactive), NokidoRSSWatcher (sandbox-online).
#
# Example (commented — no live consumer today):
#   [[service]]
#   name = "NokidoWasmRuntime"
#   wave = 3
#   cmd = "${WASMEDGE}"
#   args = ["serve", "..."]
#   cwd = "${ROOT}"
#   essential = false
#   runAs = "sandbox-offline"

[vars]
# Resolved relative to the supervisor's cwd at load time, except absolute
# paths which stay literal until the platform shim (step 2) generalises them.
ROOT        = "."
PROXY_DIR   = "./proxy_deno"
# Magasin des BINAIRES TIERS, hors depot par construction : un navigateur, un
# relais ou un moteur vectoriel n'ont rien a faire dans git (poids, licences,
# et ils casseraient la wheel PyPI). Ils ne sont pas non plus dans un `tmp`, qui
# n'est ni sauvegarde ni stable. Une autre machine -- ou la distribution
# publique -- surcharge NOKIDO_BIN par variable d'environnement : le loader fait
# primer l'environnement sur cette table, donc aucun fichier n'est a modifier.
NOKIDO_BIN  = "C:/nokido"
PYTHON      = "%USERPROFILE%/miniforge3/python.exe"
PYTHON_HOME = "%USERPROFILE%/miniforge3"
PY314       = "%USERPROFILE%/miniforge3/envs/laforge_py314/python.exe"
PY314T      = "%USERPROFILE%/miniforge3/envs/laforge_py314t/python.exe"
PY312_RYZEN = "%USERPROFILE%/miniforge3/envs/ryzen-ai-final/python.exe"
# Tier policy 2026-05-29 (per Gemini Web hybrid runtime + multi-thread bench proof):
#   PYTHON      = legacy / compat / migrations one-shot (base 3.12)
#   PY312_RYZEN = ONNX NPU embed workers (Ryzen AI 1.7 SDK exclusif)
#   PY314       = canonical 2026 cortex single-thread (Hub, daemons, cortex RPC).
#                 +8.2% pipeline pur Python vs py312 (bench_chain).
#                 single-thread service handler -> PY314 ideal.
#   PY314T      = free-threaded PARALLEL-CPU workloads uniquement.
#                 Multi-thread bench 2026-05-29 PROVE :
#                   - 6.3x speedup pure-Python @ 8 threads
#                   - 2.5x AMI mix @ 4 threads
#                   - py314 GIL REGRESS sur AMI @ 4+ threads
#                 Acte 5 partial DEFER : per-workload flip via
#                 tools/forge_py314t_readiness.py probe. 6/9 candidats prets :
#                   - forge_handoff (multi-agent LLM eval)
#                   - forge_world_model_ami (AMI JEPA batch)
#                   - forge_lats_general (MCTS rollouts parallel)
#                   - forge_tem_factorize (numpy batch)
#                   - forge_semantic_pressure (cluster compute batch)
#                   - forge_bge_m3_shared (in-process ONNX shared, requires cp314t onnxruntime)
#                 Wire `cmd = "${PY314T}"` quand un service de cette liste
#                 devient majoritairement CPU-parallel.
DENO        = "%USERPROFILE%/.deno/bin/deno.exe"
LLAMA       = "%USERPROFILE%/llama-vulkan/llama-server.exe"
OLLAMA_EXE  = "%USERPROFILE%/AppData/Local/Programs/Ollama/ollama.exe"
OLLAMA_DIR  = "%USERPROFILE%/AppData/Local/Programs/Ollama"
LMS_EXE     = "%USERPROFILE%/.lmstudio/bin/lms.exe"
LMS_DIR     = "%USERPROFILE%/.lmstudio"
# NETCFG_EXE : binaire compile ABSENT du disque (verifie 2026-07-24) et reference
# par AUCUN service — NokidoNetcfgMCP tourne via Python, seul NETCFG_DIR sert (cwd).
# Laissee commentee plutot que supprimee : une variable morte qui a l'air vivante
# fait echouer le premier qui s'y fie, et l'erreur parlera d'autre chose.
# NETCFG_EXE  = "%NOKIDO_WORKSPACE%/netcfg-agent-mcp/dist/netcfg-agent-mcp.exe"
NETCFG_DIR  = "%NOKIDO_WORKSPACE%/netcfg-agent-mcp"
NETCFG_UI   = "%NOKIDO_WORKSPACE%/netcfg-agent-web/demo/serve_ui.py"
MODEL_7B    = "D:/ollama/models/blobs/sha256-60e05f2100071479f596b964f89f510f057ce397ea22f2833a0cfe029bfc2463"
DRAFT_1B    = "D:/ollama/models/blobs/sha256-29d8c98fa6b098e200069bfb88b9508dc3e85586d20cba59f8dda9a808165104"

# ── VAGUE 1 : Tronc Cérébral (réseau & hub principal) ──────────────────
[[service]]
name = "NokidoMCP"
# INNERVATION (2026-08-25). Le hub tenait son contrat par PALPATION seule — cpu et
# sockets, mesures du dehors. L'ancetre de tous les jobs ne disait rien de son etat.
# `emis<600` exige desormais un battement EMIS dans la moelle afferente. Il est pour
# l'instant MEDIE (son /health repond quand on l'interroge, cf forge_organ_afferent) ;
# l'emission DIRECTE depuis sa propre boucle reste la cible.
intention = "capability:hub"
objectif = "emis<600 | listen | conn>0"
wave = 1
cmd = "${PY314}"
args = ["tools/nokido_hub.py"]
cwd = "${ROOT}"
port = 8766
# `capabilities` = ce que ce service SERT (≠ `deps`, qui dit ce dont il a besoin).
# Lu par forge_service_capabilities : un porteur de capacité critique n'est jamais
# évincé sous pression RAM. Sans ce champ, le 24-07 a endormi les 3 piliers du RAG.
capabilities = ["hub"]
essential = true
neverSleep = true
# BATTEMENT DECLARE (2026-08-26). Le contrat `objectif = "emis<600"` ci-dessus attendait
# un pouls EMIS depuis le 25/08 — mais aucun heartbeat n'etait declare, et le hub n'en
# emettait aucun : le contrat ne pouvait pas etre verifie. `_battement_de_service` (tache
# asyncio de nokido_hub.py) ecrit desormais ce fichier toutes les 60 s.
# Pourquoi ca compte : le superviseur arrete le hub par `proc.kill("SIGTERM")`, or Windows
# n'a pas de SIGTERM — Deno le traduit en TerminateProcess, qui detruit le processus sans
# qu'aucun handler ne s'execute (mesure : deux redemarrages, zero ligne de fin ecrite).
# Le battement ne dit pas POURQUOI le hub est mort, il dit QUAND il vivait encore.
heartbeat = "sandbox/hub.heartbeat"
heartbeat_tier = "normal"
# LAFORGE_VEC_SIDECAR_PORT=8098 => CUTOVER RAG dense vers Qdrant natif (chantier
# 2026-07-06, parite 1.00 @ p50 61ms). Rollback = retirer cette cle (defaut 8097 faiss).
# LAFORGE_PROXY_MEMORY(+_WRITE)=1 => memoire Letta stateful PAR THREAD dans agent_proxy.ask
# (recall archival persistant injecte au system_prompt + persist ; 2026-07-07, latence
# ~9ms p95 mesuree ; borne par retention keep-5000/agent). Rollback = "0" ou retirer.
# LAFORGE_SAMPLER_AUTOSTART=1 (2026-07-30) => DESIGNE le hub proprietaire de
# l'echantillonneur de ressources. Sans declaration, la propriete etait decidee par un
# repli implicite (premier appelant, reprise si l'etat publie vieillit) et restait
# INDETERMINABLE : impossible de savoir si l'eviction automatique a 75 % tournait dans
# le process qui detient les caches reclamables. Or ce doit etre le hub, puisque c'est
# lui qui porte la matrice dense (~2.3 Go) rendue par Step 1bis. Un seul proprietaire
# reste la regle (mesure 2026-07-26 : un sampler par appelant = une sonde PowerShell
# par tick chez chacun) ; il est desormais NOMME au lieu d'etre subi.
# LAFORGE_EVICT_DYNAMIC=1 (2026-07-25) => rearme l'eviction par capacite (Step 2b-bis
# de request_resources). Condition posee le 24-07 REMPLIE : forge_service_capabilities
# existe et les piliers declarent leurs capabilities (hub/dense_search/embedding/
# reranking) -> is_critical les protege, verdict world-model requis, abstention sinon.
# Rollback = "0".
# LAFORGE_ALLOW_CRITICAL_WRITE : fenetre de maintenance OUVERTE puis REFERMEE le
# 2026-08-12 (autorisation owner explicite). Elle leve le refus de `governed_edit`
# et de `forge_mcp_security` sur les CRITICAL_FILES — donc elle DESARME UNE GARDE
# POUR TOUT LE DEPOT, pas pour un fichier. Une classe exemptee est une zone qui
# n'est plus balayee : elle ne doit exister que le temps d'un chantier nomme.
# Ouverte pour deux patches, livres au commit 2bbe6fa9 : `_session_courante()`
# dans le hub (network_log.session_id etait rempli 0 fois sur 62 962) et
# l'entree `poll` dans `_TOOL_MIN_RING`. Chantier clos -> refermee.
# Pour rouvrir : remettre LAFORGE_ALLOW_CRITICAL_WRITE = "1" ici + relance par
# LaForge-Master (la variable ne se recharge PAS a chaud), et la refermer apres.
# PYTHONTRACEMALLOC : trace les allocations DES LE DEMARRAGE de l'interpreteur,
# avant le premier import — la seule facon d'observer le pic du BOOT.
# MESURE 2026-08-19 : ce process a atteint 13,8 Gio d'engagement (peak_pagefile)
# sur une machine qui n'en expose que 23,67, une seule fois, jamais reatteint :
# ce n'est ni une fuite ni une retention, c'est une AMPLITUDE, et c'est elle qui
# declenche pagination et compression memoire.
# `app/hardware/mem_watchdog.py` sait profiler mais s'arme SUR SEUIL : il
# arriverait apres la bataille. Et `tracemalloc` ne trace QUE ce qui suit son
# start(), d'ou cette variable plutot qu'un appel place dans le code.
# ⚠️ COUT REEL : tracemalloc double le cout des allocations. C'est un reglage de
# CAMPAGNE — mesurer, lire le dump, puis RETIRER cette entree. La laisser en
# permanence sur un hub qui pique deja a 13,8 Gio ferait payer l'observation
# plus cher que ce qu'elle apprend.
# LAFORGE_EVICT_DYNAMIC : "1" -> "conditioned" (2026-08-25, go owner).
# La cle valait "1" depuis le 2026-07-25 (commit 9e334efae). Or "1" est le mode
# HISTORIQUE, SANS condition : `_heavy_evictable_services` ne consulte
# `_evict_conditions_met` QUE pour "conditioned"/"auto". L'urgence mesuree et le
# "aucun travail en cours" etaient donc sautes en production.
# Le 2026-08-03 le defaut du CODE est passe a "conditioned", avec cette phrase
# explicite : « PAS a "1" ». Personne n'a retire l'override d'env, plus ancien --
# donc le mode conditionne n'a JAMAIS tourne, et le code se relisait comme garde.
# Cout mesure le 2026-08-25 : NokidoLlamaEmbed, pilier embedding, endormi 9 fois en
# 7 jours ; c'etait le seul organe a portee de l'effecteur.
# Lecon generale : un defaut de code corrige ne corrige rien tant qu'un override
# d'environnement plus ancien le recouvre. Le defaut se lit, l'override s'applique.
#
# PYTHONTRACEMALLOC : retire puis REMIS le 2026-08-25, pour une campagne NOMMEE —
# « de quoi sont faits les ~6,7 Go que le hub tient, et son pic de 11 Go ».
# Pourquoi il faut cet instrument-la et pas un autre, mesure a l'appui du jour meme :
#   - `psutil.memory_maps()` sur le hub rend AccessDenied depuis un compte non
#     privilegie — la carte des regions est hors de portee ;
#   - `/admin/heap` parcourt `gc.get_objects()`, qui ne rend QUE les conteneurs suivis
#     par le ramasse-miettes : 50 Mo tous types confondus sur 6,7 Go. Les `str`, les
#     `bytes` et les tampons numpy — c'est-a-dire la masse — lui sont INVISIBLES ;
#   - la lecture de code s'est trompee DEUX fois (module mort `forge_vector_index`,
#     puis `_load_embeddings` dont la correction n'a pas bouge le pic : 11,878 -> 11,02).
# Trois hypotheses fausses coutent plus cher que la campagne.
# CAMPAGNE CLOSE le 2026-08-25, cle RETIREE, contrat tenu. Ce qu'elle a rendu, en un
# seul appel a /admin/heap, apres que la lecture de code se soit trompee deux fois :
#   4 720,1 Mo en 3 allocations -> app/forge_mcp_registry.py:6510
#     = np.empty((1 152 197, 1024), float32), la matrice dense du RAG, en RAM ;
#      264,1 Mo en 888 432 allocations -> :6576 (le dict meta, texte tronque a 512) ;
#      153,5 Mo en 1 695 049 allocations -> :6542 (le parcours du curseur).
# Soit 5,34 Go traces sur 5,95 Go d'engagement : la masse du hub est NOMMEE.
# Et le point qui restait invisible sans cet instrument : `forge_rag_engine` n'est meme
# pas importe dans ce process. Le cutover Qdrant est honore par ce module-la, et
# IGNORE par `_load_dense_cache`, qui est celui que le hub execute vraiment (0
# occurrence de "sidecar" dans forge_mcp_registry.py).
# Pour rouvrir : remettre PYTHONTRACEMALLOC = "1", un restart, lire, puis retirer.
# LAFORGE_MASTER_BORNE = "1" (2026-09-24, DECISION OWNER « 1 oui ») : le porteur du maitre
# qui se presente sous un nom d'organe est ramene au plancher anti-spoof (ring 4) au lieu
# d'heriter du ring de cet organe (forge_videur.resolve_identity, borne_appliquee=True).
# Mesure qui l'a permis : impersonation +0 entre 15:49 et 16:24 ; ecart_si_borne = 36
# declassements, tous WEBHUB historiques. Le maitre qui se dit MASTER et tout jeton propre
# sont epargnes. Rollback = retirer la cle (observation, comme avant) + relance du hub.
# LAFORGE_ADMIN_TPM_ENFORCE = "1" (2026-09-24, DECISION OWNER « si la preuve TPM est valide,
# arme ») : un ORGANE qui presente son jeton propre sur une route d'administration doit
# prouver la possession de sa cle TPM (DPoP adossee au TPM, empreinte ENREGISTREE au
# registre) ; sans preuve LIEE -> 401. Mesure qui l'autorise : 17:02:29, les deux appels
# /admin/run_job du superviseur, emis depuis SON compte, sont LIEE (preuve valide) ; le GC
# NREM3 porte la preuve depuis le meme commit. Rollback = retirer la cle + relance du hub.
env = { PYTHONIOENCODING = "utf-8", SANDBOX_EXEC = "1", PYTHONUTF8 = "1", LAFORGE_VEC_SIDECAR_PORT = "8098", LAFORGE_PROXY_MEMORY = "1", LAFORGE_PROXY_MEMORY_WRITE = "1", LAFORGE_M2M_ENVELOPE = "1", LAFORGE_EVICT_DYNAMIC = "conditioned", LAFORGE_SAMPLER_AUTOSTART = "1", LAFORGE_SWITCHES_DB_PATH = "${ROOT}/sandbox/access_switches.db", LAFORGE_MASTER_BORNE = "1", LAFORGE_ADMIN_TPM_ENFORCE = "1" }
# PYTHONTRACEMALLOC 25 -> 1 (mesure 2026-08-20). 25 frames de pile conservees
# par ALLOCATION VIVANTE : mesure comparee, meme interpreteur, memes imports —
# 124,4 Mo sans / 394,5 Mo avec, soit x3,17 (+270 Mo) pour 63 Mo reellement
# suivis. Ce surcout est INVISIBLE a tracemalloc lui-meme : ses tables ne sont
# pas dans les chiffres qu'il rend, donc l'instrument ne peut pas se declarer.
# Correlation : le hub etait a 7,66 Go pour une reference de 0,774 Go (x9,9,
# pic engage 15,9 Go sur 23,67) avec TOUS ses threads `idle` au py-spy dump —
# profil d'une memoire RETENUE, pas travaillee. 1 frame garde le diagnostic
# (fichier + ligne qui alloue) pour ~1/25 du cout. Rollback = remettre "25".

[[service]]
name = "NokidoOllama"
# ATTENTION : le temoignage d'Ollama passe par /api/tags, qui rend un CACHE et peut
# mentir sur ce qui est reellement charge. `emis<` prouve donc qu'il VIT, jamais ce
# dont il est capable — ne pas s'en servir pour conclure a une disponibilite modele.
intention = "cognition:cerveaux_locaux"
objectif = "emis<600 | listen"
wave = 1
cmd = "${OLLAMA_EXE}"
args = ["serve"]
cwd = "${OLLAMA_DIR}"
port = 11434
essential = true
# OLLAMA_GPU_OVERHEAD = 1073741824 (1 GB) reserve compositeur Windows = cap
# VRAM strict. RCA 2026-05-24 : driver Radeon 780M sature => BSOD VIDEO_SCHEDULER.
# Sur APU iGPU partage VRAM systeme, JAMAIS laisser ollama bouffer > 80%.
# OLLAMA_NO_CLOUD = "1" (2026-09-24, veille lot_B_23) : Ollama sait router vers SON cloud
# (modeles `-cloud`, recherche web) ; l'Ollama installe affichait `OLLAMA_NO_CLOUD:false`.
# Or `SemanticFirewall.pre_flight` classe le fournisseur « ollama » comme LOCAL et ne lui
# applique pas la DLP : un modele cloud tire par Ollama sortirait sans pare-feu. On coupe a
# la SOURCE (FAQ officielle : variable OLLAMA_NO_CLOUD=1, effet au redemarrage du service).
env = { OLLAMA_MODELS = "D:/ollama/models", OLLAMA_KEEP_ALIVE = "30s", OLLAMA_MAX_LOADED_MODELS = "1", OLLAMA_HOST = "127.0.0.1:11434", OLLAMA_GPU_OVERHEAD = "1073741824", OLLAMA_FLASH_ATTENTION = "1", OLLAMA_NO_CLOUD = "1" }

[[service]]
name = "NokidoNetcfgProxy"
# :8767 est le lazy PROXY ; le MCP reel vit sur :8768 et relaie le meme /health.
