[[service]]
# Embedding bge-m3 (Q8 GGUF, pooling CLS) — utilise par le rebuild RAG et les
# benchmarks. Service supervise -> demarrable par l'agent via :8765.
name = "NokidoLlamaEmbed"
# INTERRUPTEUR LEVE le 2026-09-16, sur mesure et sur mandat owner.
# Le commit 43b769366 du 2026-09-06 s'intitule « pilier local reouvert, borne et
# regule ». Il a effectivement borne les args ci-dessous (-c 2048, -b 2048,
# --ubatch-size 512, --parallel 1 : pente RAM divisee par ~6, de 1,8 a 0,21-0,34 Go
# par millier de chunks), c'est-a-dire qu'il a traite LA CAUSE de l'ecartement du
# 2026-08-06. Mais son diff sur ce fichier ne touche AUCUNE ligne `disabled` : un
# seul hunk, @@ -1002,9 +1002,20 @@, qui n'ajoute que des commentaires et des args.
# La cause etait reparee, l'interrupteur est reste ferme. Pendant dix jours
# l'historique a donc dit « rouvert » pendant que le service etait eteint --
# l'existence d'un mecanisme n'est pas son effet reel, y compris quand le
# mecanisme est un message de commit.
# COUT MESURE de cet oubli, le 2026-09-16, sur une veille du depot langfuse :
# :8099 injoignable, cloudflare refuse en « Authentication error », circuit
# breakers OPEN sur llama8099 / cloudflare / modal -- donc TOUT chunk ingere
# entrait SANS vecteur, cherchable en BM25 seulement.
# CAPACITE REPROUVEE avant de lever l'interrupteur, et pas seulement le transport :
# POST /embedding rend un vecteur de dimension 1024. Un port ouvert n'aurait rien
# prouve sur le chargement du modele.
disabled = false
wave = 4
cmd = "${LLAMA}"
# `--metrics` ajoute le 2026-08-05 : sans lui, /metrics rend 501 Not Implemented et
# le corps ne peut pas savoir COMBIEN de requetes ce serveur traite. Mesure du jour :
# l'embedder est passe de 2,73 a 6,07 Go et la seule facon d'etablir qu'il TRAVAILLAIT
# (au lieu de fuir) a ete de compter des sockets en TIME_WAIT — un contournement.
# llama.cpp expose nativement le compteur ; il suffisait de le demander. Cout : nul.
# BORNES MESUREES 2026-09-06 (tools/forge_embed_8099_mesure_bornee.py, job_31eeba6ee702) :
# avec -c 8192 -b 2048 --ubatch-size 2048, un drain de 896 chunks (0,062 s/chunk, soit
# ~58 000/h) fait passer le RSS de 0,61 a 2,45 Go en 55 s -- pente ~1,8 Go / 1000 chunks --
# et la RAM machine de 80 a 88 % : la garde a coupe avant le plateau. C'est la meme
# croissance qui avait mene a 10,92 Go le 2026-08-06 et a l'ecartement du pilier local.
# Apres bornage (mesure du meme jour, 1 000 chunks) : le RSS demarre a 0,61 Go, atteint
# 2,32 Go des les premiers lots -- cout FIXE -- puis croit de 0,21 a 0,34 Go pour 1 000
# chunks selon la fenetre. La pente est divisee par ~6, elle n'est PAS nulle : le plateau
# n'est pas prouve a cette echelle, et une campagne de 100 000 chunks doit recycler le
# service par lots plutot que compter sur un plafond.
# Le contexte et le lot sont donc bornes a ce que le corpus demande REELLEMENT : les
# chunks en attente font 701 a 800 caracteres (~250 jetons), donc 2048 jetons de
# contexte suffisent et un lot logique de 2048 couvre 8 textes ; --ubatch 512 abaisse le
# pic de calcul. Un texte plus long est tronque par llama.cpp au contexte : le drain
# envoie des chunks, pas des documents. A re-mesurer par le meme outil apres tout
# changement de ces valeurs.
args = ["-m", "${ROOT}/data/llm_models/bge-m3-Q8_0.gguf", "--embedding",
        "--pooling", "cls", "-ngl", "99", "--host", "127.0.0.1", "--port", "8099",
        "-c", "2048", "-b", "2048", "--ubatch-size", "512", "--parallel", "1", "--metrics"]
cwd = "${ROOT}"
port = 8099
capabilities = ["embedding"]
essential = false

