# profil owner, INVISIBLES en SYSTEM (mesure 2026-07-31 : « Acces refuse » sur
# AppData/Local/agy depuis le compte de service — refuse, pas absent).
#
# POURQUOI UNE INSTANCE SEPAREE plutot que d'elever NokidoTaskExecutor : celui-ci
# traite TOUTES les taches, y compris des entrees non fiables ; lui donner la
# session owner elargirait la surface pour un seul chemin qui en a besoin. Ici le
# privilege est borne au filtre --agent WORKER_CODE. Moindre privilege.
#
# CE QUE CA REPARE : sans l'OAuth agy, l'executeur ne pouvait que RELAYER vers
# l'auto-repondeur, qui accuse reception sans executer — la tache « rejouer les 7
# veilles » a ete close en 20 s sans qu'aucune veille ne bouge. Avec ce service,
# `_peut_lancer_agy()` mesure la capacite et route vers agy en mode AGENT, qui
