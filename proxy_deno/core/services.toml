# general les exclut) : si elle dort, elles ATTENDENT visiblement au lieu d'etre
# faussement completees.
#
# Requiert user logge (session console), comme les autres services interactifs.
# disabled=false : c'est le seul chemin d'EXECUTION autonome du code.
[[service]]
name = "NokidoTaskExecutorAgy"
disabled = false
wave = 5
cmd = "${PYTHON}"
args = ["tools/forge_task_executor.py", "--agent", "WORKER_CODE"]
cwd = "${ROOT}"
