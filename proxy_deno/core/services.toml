#
# CE QUE SON ABSENCE A COUTE, mesure le 2026-09-20 : les deux drains de taches
# NokidoTaskExecutorAntigravity et NokidoTaskExecutorAgy sont morts SILENCIEUSEMENT
# (aucune trace dans leur journal), la file s'est arretee, et rien n'a reagi pendant
# 55 minutes. Son role est precisement de voir ces morts-la : il lit les evenements
# 7031 et 7034 du Service Control Manager et persiste un critical_event que
# forge_coagulation consomme deja.
#
# ⚠️ RISQUE NOMME PLUTOT QUE MASQUE : il interroge le journal d'evenements Windows
# via `wevtutil`. Si le compte du superviseur n'y a pas acces, il mourra au
# demarrage — et c'est ACCEPTABLE : son pouls le dira au tour suivant, ce qui vaut
# infiniment mieux qu'un surveillant absent dont l'absence, elle, ne dit rien.
# `essential = false` : son echec ne doit pas empecher le reste de demarrer.
name = "NokidoServiceCrashWatcher"
wave = 4
cmd = "${PYTHON}"
args = ["tools/forge_service_crash_watcher.py"]
cwd = "${ROOT}"
essential = false
env = { PYTHONIOENCODING = "utf-8" }
heartbeat = "sandbox/service_crash_watcher.heartbeat"
heartbeat_tier = "slow"
