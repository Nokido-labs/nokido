[[service]]
# Runner GitHub Actions self-hosted — mis sous supervision le 2026-07-25 (go owner).
#
# POURQUOI : il n'etait PAS un service. Configure en mode console (aucun `svc.cmd` a la
# racine, `bin/` ne contient que les templates Linux/macOS), il tournait via `run.cmd`
# dans une fenetre : il ne survivait ni a sa fermeture, ni a un reboot, ni a une
# coupure reseau. Mesure du jour : `SocketException (995)` pendant que trois files de
# crawl saturaient reseau et RAM, runner `offline`, et DEUX runs CI en
# `startup_failure`/`cancelled` -- job reste `queued` sans une seule etape, alors que
# le code n'y etait pour rien. Un CI dont l'executant n'a aucun mecanisme de reprise
# est un angle mort : il echoue en silence et on croit lire un echec de code.
#
# Le superviseur apporte exactement ce qui manquait : respawn-on-death + demarrage avec
# la stack. Pas besoin de droits SCM (refuses aux comptes hub) ni de reconfigurer le
# runner (ses `.credentials` restent valides).
#
# DEUX PIEGES EVITES ICI, tous deux deja payes :
#   - `cmd /c` est OBLIGATOIRE pour lancer un .cmd. Sans le `/c`, le service demarre et
#     ne fait RIEN (cf. LaForgeWatchdog « castre », gotcha 2026-07-21).
#   - `runAs = "interactive"` : les jobs CI ont besoin du profil OWNER (config git,
#     miniforge, credentials). En SYSTEM ils divergeraient du contexte de test reel,
#     et le runner ecrirait son `_work` avec les mauvaises ACL.
#   - `cmd` doit pointer cmd.exe en BACKSLASHES. Lance en slashes, cmd.exe
#     re-analyse son PROPRE chemin et prend `/Windows/System32/cmd.exe` pour
#     des SWITCHES -> « La syntaxe de la commande n'est pas correcte »,
#     exit 1 en 0s, a CHAQUE spawn. Matrice mesuree le 2026-07-27 (t3.cmd) :
#       exe slash    + arg slash     -> ECHEC
#       exe slash    + arg backslash -> ECHEC
#       exe backslash+ arg slash     -> OK
#       exe backslash+ arg backslash -> OK
#     => c'est l'EXECUTABLE qui compte, l'argument est indifferent. Les autres
#     services gardent des slashes sans probleme : seul un interpreteur qui
#     re-parse sa ligne de commande (cmd.exe) est concerne, pas python.exe.
#     Consequence mesuree : ce service n'avait JAMAIS demarre depuis sa mise
#     sous supervision le 25/07 ; une tache planifiee SYSTEM \LaForge-Runner
#     compensait en session 0, ou git perd le profil owner. Tache desactivee
#     le 27/07.
name = "NokidoCIRunner"
# `aucun` est un verdict DECLARE, pas un oubli : ce service est un LANCEUR
# (runAs=interactive), le registre note le pid du lanceur et c'est son ENFANT qui
# travaille. Aucune mesure prise sur le pid declare ne dit quoi que ce soit de son
# activite reelle — mieux vaut le dire que produire un faux manquement.
intention = "launcher:ci"
objectif = "aucun"
wave = 5
cmd = "C:\\Windows\\System32\\cmd.exe"
args = ["/c", "C:\\laforge-runner\\run.cmd"]
cwd = "C:/laforge-runner"
runAs = "interactive"
essential = false
# neverSleep (2026-09-27) : la rafale RAM (supervisor.ts, memPct > RAM_SLEEP_PCT) endormait
# le runner EN PLEIN JOB. Journal du superviseur, deux fois le meme jour, les deux pendant
# `pytest-pur` : « 20:01:41 Sleeping NokidoCIRunner » (run 36337595514) et « 20:47:04 RAM
# 97.0% > 88% ... Sleeping NokidoCIRunner (uptime 1765s) » (run 36340236121). Listener et
# Worker se taisent a la meme seconde, GitHub voit le runner `offline`, le job depasse sa
# borne et sort `cancelled` : 20 min de suite perdues et un verdict ILLISIBLE, pris pour une
# CI rouge alors que le code n'y etait pour rien. Endormir le runner ne libere rien d'utile
# au repos (Listener seul) et detruit la mesure en charge. Meme regle que le keeper :
# neverSleep n'exempte QUE de la rafale ; l'eviction CIBLEE (POST /supervisor/sleep/<nom>)
# reste possible. NR : tests/nr/test_runner_ci_pas_endormi_nr.py.
neverSleep = true
env = { PYTHONIOENCODING = "utf-8" }



