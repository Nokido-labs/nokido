[[service]]
# Boite noire du hub (2026-08-14) — le seul organe qui SURVIT a ce qu'il observe.
#
# Le hub est tombe 12 fois en 3 jours sans qu'aucun diagnostic soit possible :
# tous les capteurs vivent DANS le hub, et `vitals_history.jsonl` s'interrompt a
# la seconde de sa mort. Les minutes qui comptent sont exactement celles qui
# manquent ; les pics RAM a 99,9 % qu'on y lit sont ceux du REDEMARRAGE.
#
# PAS de `deps` : un observateur qui attend sa cible ne l'observe pas. PAS de
# `runAs` non plus, et c'est le seul point qui demande un mot. `runAs` sert ici
# a DE-privilegier (interactive / sandbox-offline / sandbox-online) ; l'omettre
# laisse le service sous le compte du superviseur, comme le hub lui-meme. C'est
# necessaire et suffisant : sous un compte moindre, 310 process sur 314 ont une
# cmdline illisible, donc le RSS du hub reste invisible et « process absent » ne
# se distingue pas de « interdit de regarder » (mesure du 2026-08-14).
#
# Ce que ce privilege autorise, borne par le code : psutil en LECTURE, un
# connect() sur 127.0.0.1:8766, et un append JSONL dans sandbox/. Aucun
# subprocess, aucune sonde GPU (mesuree a 1562 ms — une sonde d'echantillonnage
# a deja gele cette machine le 2026-07-26), aucun egress.
name = "NokidoHubBlackbox"
# INNERVE le 2026-08-25 par EMISSION DIRECTE : sans port, il ne pouvait pas temoigner
# par une interface — il ecrit donc son propre battement. Un organe qui surveille doit
# etre surveillable, sinon sa disparition ne se voit qu'au trou qu'elle laisse.
intention = "observation:boite_noire"
objectif = "hb<600 | cpu>0.05"
heartbeat = "sandbox/hub_blackbox.heartbeat"
heartbeat_tier = "normal"
wave = 1
cmd = "${PYTHON}"
args = ["tools/forge_hub_blackbox.py"]
cwd = "${ROOT}"
essential = false

[[service]]
# NOEUD SINUSAL (owner 2026-09-03) — « le pouls doit emaner du coeur ».
#
# Avant lui, sept organes portaient chacun leur horloge : autant de pacemakers
# independants qui derivent. Mesure qui l'a impose : forge_hebbian_linker cumulait
# 765 relances « heartbeat stale » et 2377 sorties, parce qu'un cycle de 6 h ne peut
# pas satisfaire un seuil de 600 s. Ce service publie tick + periode_s ; les organes
# LISENT ce rythme au lieu de le calculer (forge_heartbeat.Cadence).
#
# WAVE 1 : il doit battre AVANT les organes qu'il perfuse. S'il manque, ceux-ci ne
# meurent pas — ils passent en rythme d'ECHAPPEMENT a 45 s et le declarent.
#
# TIER `normal` ET NON `fast`, et c'est deliberé : `fast` declare degraded au-dela de
# 30 s, or le coeur bat legitimement jusqu'a 45 s AU REPOS. Il serait donc rapporte
# malade alors qu'il fonctionne — un garde qui crie a faux se fait desarmer. La
# contrepartie assumee : un arret cardiaque est releve en 600 s, pendant lesquelles
# l'echappement tient le corps et le DIT dans chaque afference.
name = "NokidoCardiacNode"
intention = "regulation:rythme"
objectif = "hb<600 | periode 15..45s"
heartbeat = "sandbox/cardiac_node.heartbeat"
heartbeat_tier = "normal"
wave = 1
cmd = "${PYTHON}"
args = ["app/forge_cardiac_node.py", "--daemon"]
cwd = "${ROOT}"
essential = false

[[service]]
# Docker daemon keeper (Phase 4 2026-05-24) — probe `docker info` toutes les
# 30s, relance Docker Desktop.exe si daemon down (cooldown 2min), publie
# heartbeat sandbox/docker_keeper.heartbeat. Avant ce keeper, Docker = SPOF
# silencieux pour ~13 modules consommateurs (Exegol, SearXNG, agent_proxy,
# rag_warmup, etc.). Aucun container Docker ne devrait depend du daemon
# sans ce keeper actif en wave 1.
name = "NokidoDockerKeeper"
wave = 1
cmd = "${PYTHON}"
args = ["tools/forge_docker_keeper.py"]
cwd = "${ROOT}"
essential = false
# 2026-07-23 : sous RAM >85% le boot Docker depasse 90s -> un keeper arme le
# re-tuait mid-boot toutes les 120s (doom loop). 300s laisse _wait_daemon
# bloquer la boucle pendant tout le boot = zero kill premature. On-demand inchange.
# DOCKER_KEEPER_AUTOLAUNCH : REPASSE A "0" le 2026-07-25 (meme jour que son
# armement). Mesure : l'engine ne survit que ~6 min a une charge conteneur, donc
# AUTOLAUNCH ne produisait pas un Docker disponible mais une BOUCLE de relance
# visible par l'owner (relance -> mort -> relance). Regle owner : lancer Docker
# OUI, le faire BOUCLER NON. Ne PAS rearmer avant que l'engine tienne sous charge
# (suspect n°1 = bind du settings.yml searxng, chemin hote a ESPACES
# « Script python IA » -> « hostPathOfVolume ... failed, skipping bind »).
# DOCKER_KEEPER_WSL_SHUTDOWN : REMIS A "0" le 2026-08-14 — il valait "1" alors que
# `0a880f22` l'avait explicitement desarme (anti-sawtooth). Distinguer les DEUX
# effecteurs : `wsl --unmount` (purge CIBLEE du verrou docker_data.vhdx, indispensable
