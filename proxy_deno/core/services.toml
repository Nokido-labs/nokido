[[service]]
# SOIF DE CONNAISSANCE : lit query_log, mesure la couverture (rerank double-seuil +
# abstention), emet un ressenti sur gap CERTAIN et propose au blackboard. Veille
# effective desarmee par defaut (LAFORGE_EPISTEMIC_AUTO_VEILLE=1 pour armer).
name = "NokidoEpistemicSoif"
disabled = false
wave = 4
cmd = "${PYTHON}"
args = ["tools/forge_epistemic_daemon.py", "--interval", "900"]
cwd = "${ROOT}"
# 2026-09-20 — :8100 RETIRE DES DEPS, et c'est une DEGRADATION ASSUMEE, pas une
# reparation. Mesures qui l'autorisent, les deux branches exigees avant de
# toucher a cette ligne :
#   BASIC SANS :8100  -> job_7267c969409c rc=0 : soif_intention 6, soin 4
#   HEAVY AVEC :8100  -> coverage_dense() rend ok=False gap=None en 3,4 s
# Le chemin extero est donc FAIL-SAFE ET RAPIDE : sans reranker il S'ABSTIENT,
# il ne plante ni ne bloque. Garder :8100 en dep sacrifiait le mode intero (qui
# FONCTIONNE) pour proteger un mode extero qui s'abstient proprement de toute facon.
#
# POURQUOI LA DEP ETAIT INSATISFIABLE : NokidoLlamaReranker est disabled=true et
# ne s'allume que sur l'intention `rerank.wanted` ; son UNIQUE consommateur est
# forge_llama_keeper._piliers_on_demand ; or NokidoLlamaKeeper est disabled=true
# depuis le 2026-09-05, gele pour un defaut du CODER etranger aux piliers RAG.
# Le superviseur POSE pourtant l'intention a chaque tentative (declareDepWanted,
# supervisor.ts:1019). L'emission reussit, personne ne recoit, le defer est
# eternel -- dernier pouls du keeper 2026-09-05T20:36:02, minute exacte de la
# mort notee au SSoT. :8099 reste ouvert parce que NokidoLlamaEmbed est PERMANENT,
# pas parce qu'un second rallumeur existerait.
#
# CE QUI RESTE OUVERT, et n'est PAS referme par cette ligne : tant que le
# reranker ne tourne pas, `coverage_dense` s'abstient et la soif n'a PAS de
# detection de gap exteroceptive. Geste OWNER : redonner un consommateur vivant a
# `rerank.wanted` SANS reveiller la fonction coder du keeper (deadlock du
# 2026-08-19). La brique est deja separee -- `_piliers_on_demand` passe par
# forge_ensure_service.ensure, jamais par _kill.
# Garde : tests/nr/test_deps_on_demand_ont_un_rallumeur_vivant_nr.py
deps = [8099, 6333]
essential = false
heartbeat = "sandbox/epistemic_daemon.heartbeat"
# cycle_s PROUVE : default=900 et attente fractionnee sleep(min(60.0, reste))
# dans tools/forge_epistemic_daemon.py.
cycle_s = 900
heartbeat_max_s = 2700
# ARME le 2026-07-27 (owner : « que les capacites cognitives vivent enfin »). Le daemon
# DETECTAIT deja : son log du jour porte quatre `DOULEUR high persistee -> algedonique
# {escalate: True}` — le corps a mal, il escalade en S3->S5, et sa soif tournait
# `auto_veille=False`. Il constatait sans jamais avoir le droit de chercher.
# Le garde-fou n'est PAS ce drapeau, c'est le cap : MAX_VEILLES_CYCLE (=1) borne a une
# veille par cycle, et coverage_dense s'abstient (gap=None) sur toute zone grise ou
# hors-variete — jamais de veille sur un doute. Desarmer = remettre "0".
env = { PYTHONNOUSERSITE = "1", PYTHONIOENCODING = "utf-8", LAFORGE_EPISTEMIC_AUTO_VEILLE = "1" }

