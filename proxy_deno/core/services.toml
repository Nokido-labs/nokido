[[service]]
# Passerelle MCP exposee a ChatGPT web. Ecrite dans la nuit du 2026-09-14 (commits
# caf1bc14f -> 8e9d11431) et JAMAIS declaree ici : lancee a la main, elle a disparu
# au premier redemarrage de la stack, le 2026-09-14 au soir. Un service qu'on veut
# voir revenir se DECLARE -- le symetrique de la regle deja consignee (couper
# durablement exige `disabled`, un `stop` seul ne tient pas).
#
# CHEMIN D'ACCES : SORTANT. Le `tunnel-client` d'OpenAI long-polle en HTTPS et
# relaie vers ce service ; AUCUN port entrant n'est ouvert. Le bridge n'ecoute
# donc que le loopback, et c'est voulu.
name = "NokidoGithubBridgeMCP"
intention = "ingress:mcp_chatgpt"
objectif = "port 8791 ouvert | registre OAuth persiste sur disque"
wave = 5
cmd = "${PYTHON}"
# LE LANCEUR, pas le module : lui seul lit le coffre et pose les secrets dans
# l'environnement du serveur (appariement OAuth + jeton GitHub). Le module lance
# en direct demarre parfaitement... et n'a aucun jeton pour appeler GitHub.
args = ["tools/forge_bridge_launch.py", "--port", "8791"]
port = 8791
cwd = "${ROOT}"
deps = [8766]
essential = false
# DEFAUT MESURE le 2026-09-14, et il a coute la soiree. Le pont a tourne sous
# `LaForgeSbxOffline` (egress BLOQUE) : la chaine entiere fonctionnait -- tunnel,
# OAuth, consentement, habilitation validee, `repo_info` REELLEMENT execute -- et
# l'appel sortant vers api.github.com mourait en `URLError`. Cote ChatGPT le
# verdict est `ok:false, error:"URLError"`, qui ne nomme ni le compte ni l'egress.
#
# `sandbox-online` est le bon compte pour DEUX raisons, pas une : il autorise la
# sortie, et il DE-PRIVILEGIE. Sans `runAs`, un service lance par le superviseur
# tourne en SYSTEM -- inacceptable pour une porte exposee a ChatGPT web, qui est
# par construction une entree non fiable.
runAs = "sandbox-online"
# NOKIDO_BRIDGE_OAUTH_CLIENTS est EXIGEE, pas optionnelle. Sans elle le registre
# des clients inscrits en DCR vit en MEMOIRE : au redemarrage le serveur les
# oublie, l'appelant continue de presenter un identifiant que plus personne ne
# connait, et recoit « client inconnu ». C'est exactement la panne du 2026-09-14,
# annoncee mot pour mot dans la docstring de `forge_bridge_oauth.fichier_des_clients`.
env = { PYTHONNOUSERSITE = "1", PYTHONIOENCODING = "utf-8", PYTHONUTF8 = "1", NOKIDO_BRIDGE_OAUTH_CLIENTS = "${ROOT}/sandbox/bridge_oauth_clients.json" }

