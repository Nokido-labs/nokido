[[service]]
name = "NokidoNetcfgMCP"
# MESURE 2026-08-25 : son /health sur :7500 ne repond pas (URLError) — l'organe est
# donc MUET, et le contrat le dira au lieu de le couvrir par un pouls CPU. C'est un
