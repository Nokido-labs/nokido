[package]
name = "forge_brain_worker"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "forge_brain_worker"
path = "src/main.rs"

[dependencies]
# ONNX Runtime with DirectML (Windows GPU/NPU acceleration)
ort = { version = "2.0.0-rc.12", features = ["directml", "half"] }
# HuggingFace tokenizers — the original Rust implementation
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
# ZMQ
zmq = "0.10"
# Msgpack
rmp-serde = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Error handling
anyhow = "1"
half = "2"
# Logging
env_logger = "0.11"
log = "0.4"

[profile.release]
opt-level = 3
lto = "fat"           # Link-Time Optimization complet
codegen-units = 1     # Max optim (single unit = whole-program inlining)
# panic = "unwind" (default) + symbols preserves = compatible
# avec framework anti-saturation principe #4 (telemetrie temps reel
# post-crash). cf docs/memory/feedback-anti-saturation-framework.
